# Spring Boot 应用程序配置
# 基于涟漪模型的动态卫星搜索任务规划系统

spring:
  application:
    # 应用名称，用于服务注册、日志标识和监控
    name: ripple-satellite-planner

  # Jackson JSON 序列化配置
  jackson:
    # 日期格式，与系统内部使用的 yyyy-MM-dd HH:mm:ss 保持一致
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区设置，使用东八区（北京时间）
    time-zone: GMT+8
    # 序列化时忽略 null 值字段，减少响应体大小
    default-property-inclusion: non_null

# 服务器配置
server:
  # 服务端口
  port: 8081
  # Servlet 上下文路径
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    # 根日志级别为 INFO
    root: INFO
    # Planner 模块日志级别设为 DEBUG，便于观察规划循环过程
    com.ripple.planner.planner: DEBUG
    # 涟漪模型 Stub 设为 DEBUG，观察模拟计算过程
    com.ripple.planner.service.LianyiModelServiceStub: DEBUG
  pattern:
    # 日志格式：时间 [线程] 级别 类名 - 消息
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 自定义配置（后续扩展）
planner:
  # 最大规划循环次数，防止无限循环
  max-iterations: 10000
  # 网格分辨率（度），影响 GridService 的初始化
  grid-resolution: 1.0

# Knife4j / SpringDoc OpenAPI 配置
# 访问地址: http://127.0.0.1:8081/doc.html
springdoc:
  swagger-ui:
    # 自定义 Swagger UI 路径
    path: /swagger-ui.html
    # 启用默认模型展开深度
    default-models-expand-depth: 1
    # 启用默认模型展开
    default-model-expand-depth: 1
    # 显示请求持续时间
    display-request-duration: true
    # 启用过滤器
    filter: true
    # 显示扩展属性
    show-extensions: true
    # 显示通用扩展属性
    show-common-extensions: true
  api-docs:
    # OpenAPI 文档路径
    path: /v3/api-docs
    # 启用 API 文档
    enabled: true
  # 扫描的包路径
  packages-to-scan: com.ripple.planner.controller
  # 缓存配置（开发环境禁用，生产环境启用）
  cache:
    disabled: true

# Knife4j 增强配置
knife4j:
  enable: true
  # 文档基础配置
  setting:
    # 自定义文档标题
    title: Ripple Satellite Planner API 文档
    # 文档描述
    description: 基于涟漪模型的动态卫星搜索任务规划系统接口文档
    # 版本号
    version: v1.0.0
    # 是否显示文档聚合服务
    enableDocumentManage: true
    # 是否显示接口搜索
    enableSearch: true
    # 是否显示 Swagger 模型
    enableSwaggerModels: true
    # 是否显示请求参数缓存
    enableRequestCache: true
    # 是否显示重置缓存按钮
    enableResetCache: true
    # 是否显示分组标签
    enableGroup: true
    # 是否显示响应状态码
    enableResponseCode: true
    # 是否显示响应时间
    enableResponseTime: true
